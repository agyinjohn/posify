<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Shop POS</title>
<style>body{font-family:system-ui,sans-serif;background:#17212B;color:#fff;display:grid;place-items:center;min-height:100vh;margin:0}
div{max-width:380px;text-align:center}button{font:inherit;font-weight:600;padding:.7rem 1.4rem;border:0;border-radius:6px;background:#E3A62B;color:#17212B;cursor:pointer}</style></head>
<body><div><h1>Can't reach the shop server</h1><p>Check that this computer is online, then try again.</p>
<button id="retry">Try again</button></div>
<script>document.getElementById('retry').onclick=()=>{const u=new URLSearchParams(location.search).get('url');if(u)location.href=u;};</script>
</body></html>
